[project]
name = "pf-tool"
version = "0.5.0"
description = "AC/DC power flow for the Brazilian Interconnected Power System (BIPS): Newton-Raphson and optimization (Pyomo/Ipopt) solvers for ANAREDE .dat cases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyomo>=6.8",
  "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["prek>=0.2.0", "pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pf_tool = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=pf_tool", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["pf_tool"]
branch = false
# sys.monitoring tracing (Python 3.12+) keeps the full-case tests fast.
core = "sysmon"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pf_tool"]

[tool.typos.files]
extend-exclude = ["tests/data/", "docs/package-lock.json"]

[tool.typos.default.extend-words]
# "Line-commutated converter" (LCC) is the HVDC term.
commutated = "commutated"
# ANAREDE option code and Portuguese block names used in the data-format docs.
STPO = "STPO"
Controle = "Controle"
Circuitos = "Circuitos"
# ANAREDE option codes and abbreviated BIPS station names in bundled mappings.
PARM = "PARM"
VART = "VART"
SAV = "SAV"
RELA = "RELA"
TABE = "TABE"
TRUN = "TRUN"
CACH = "CACH"
LARG = "LARG"
BA = "BA"
GLOBA = "GLOBA"
EXTREM = "EXTREM"
DELT = "DELT"
YPE = "YPE"
PARANA = "PARANA"
PONT = "PONT"
# Power-system optimization and sensitivity-analysis acronyms.
OPF = "OPF"
PTDF = "PTDF"
